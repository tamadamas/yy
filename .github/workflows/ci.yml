# Every job here is a required check on pull requests targeting main (rule 12).
# `just check` runs the same commands locally; keep the two in sync.
#
# Two things are deliberately absent:
#
# * `RUSTFLAGS: -D warnings`. Denying warnings is configured in
#   `.cargo/config.toml` via `build.warnings`, stabilised in Rust 1.97, which
#   does not invalidate the build cache the way RUSTFLAGS does. One warm cache
#   therefore serves clippy, test, and docs.
# * A toolchain version anywhere in this file. `rust-toolchain.toml` pins the
#   exact version and its components, and rustup honours it automatically on the
#   runner. CI and a contributor's machine cannot drift apart, because there is
#   only one place that says which compiler this is.
#
# Every `uses:` is pinned to a full commit SHA (§8.5), with the version tag kept
# as a trailing comment for humans. A tag can be moved by whoever controls the
# upstream repository; a commit SHA cannot.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The only nightly in this project. rustfmt.toml uses nightly-only
      # options (§8.6); nothing else -- not building, not testing, not
      # rustdoc -- needs anything but the pinned toolchain.
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets --all-features --locked

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The protocol schema check (rule 8) is a test in yy-types, so it runs
      # here and needs no job of its own. See docs/design/verification.md.
      - run: cargo test --workspace --all-features --locked

  # rustdoc is a lint here, not a publication target: nothing about yy is read
  # on docs.rs. Its value is that the doc comments on yy-types are the source of
  # the protocol reference (§8.4), so a broken link here is a broken spec later.
  # Stable is enough -- no `--cfg docsrs` feature badges -- and the rustdoc lints
  # are denied in [workspace.lints.rustdoc] rather than via RUSTDOCFLAGS, so the
  # rule lives in the manifest where it is reviewable.
  doc-comments:
    name: doc comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo doc --workspace --all-features --no-deps --locked

  # The actual documentation: the guide and the specification, published to
  # GitHub Pages. This job only proves it builds; publishing is a separate
  # workflow that runs on main.
  book:
    name: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          # Same version pages.yml publishes with. See the note there.
          tool: mdbook@0.5.4
      - run: mdbook build docs/book

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  git-friendly:
    name: builds from a plain git clone
    runs-on: ubuntu-latest
    steps:
      # Rule 11: no jj-only step may be required to build or test. This job is
      # the evidence, which is why it is a bare checkout and nothing else.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo build --workspace --locked
