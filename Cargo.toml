[package]
name = "yy"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "A time tracker you can trust."
keywords = ["time-tracking", "cli", "tui", "productivity"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = { version = "0.29.0", features = ["serde"] }
ratatui = { version = "0.30.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "uuid", "derive", "migrate", "chrono"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.27.0", features = ["serde", "v4"] }
